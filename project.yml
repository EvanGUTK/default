name: GooglyEyes
options:
  bundleIdPrefix: co.visionairy.googly
  deploymentTarget:
    iOS: "17.0"
# MARKETING_VERSION, CURRENT_PROJECT_VERSION and DEVELOPMENT_TEAM come from Config/Shared.xcconfig
# (the team from the git-ignored Config/Local.xcconfig; see Config/Local.xcconfig.example).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  GooglyEyes:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.visionairy.googly.phone
        PRODUCT_NAME: Bluey
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Bluey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Bluey finds the Mac app on your Wi-Fi so the character can look where it points.
        NSMicrophoneUsageDescription: Talk to your blueberry. He listens while he's awake (double tap him to wake him up or put him to sleep).
        NSBonjourServices:
          - _googly._tcp
        UIAppFonts:
          - Fredoka.ttf
          - IBMPlexSans.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
